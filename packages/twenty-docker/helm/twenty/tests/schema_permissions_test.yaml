suite: database initialization contract (ownership, no schema pre-creation)
templates:
  - templates/deployment-server.yaml
release:
  name: my-twenty
  namespace: default
tests:
  # The entrypoint treats an existing "core" schema as "already migrated", so the
  # init container must never create schemas itself.

  - it: init container does NOT pre-create the core schema
    template: templates/deployment-server.yaml
    set:
      db.enabled: true
    asserts:
      - notMatchRegex:
          path: spec.template.spec.initContainers[?(@.name=="ensure-database-exists")].command[2]
          pattern: CREATE SCHEMA

  # Ownership replaces per-object grants: migrations create schemas themselves.

  - it: app user is made owner of the database
    template: templates/deployment-server.yaml
    set:
      db.enabled: true
      db.internal.appUser: twenty_app_user
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="ensure-database-exists")].command[2]
          pattern: ALTER DATABASE :"db" OWNER TO :"app_user"

  - it: app user is made owner of the public schema
    template: templates/deployment-server.yaml
    set:
      db.enabled: true
      db.internal.appUser: twenty_app_user
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="ensure-database-exists")].command[2]
          pattern: ALTER SCHEMA public OWNER TO :"app_user"

  # Regression guards for the psql-interpolation bug class: :'var' only works in
  # plain stdin statements, so the init must feed SQL via heredoc and fail loudly.

  - it: init feeds SQL via stdin heredoc, not -c strings
    template: templates/deployment-server.yaml
    set:
      db.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="ensure-database-exists")].command[2]
          pattern: "<<'EOSQL'"

  - it: init stops loudly on SQL errors
    template: templates/deployment-server.yaml
    set:
      db.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="ensure-database-exists")].command[2]
          pattern: ON_ERROR_STOP=1
